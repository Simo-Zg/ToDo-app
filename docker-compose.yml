services:
  mongodb:
    image: mongo:7
    container_name: todo-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 20s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    image: todo-app:local
    container_name: todo-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: todo_devsecops
      MONGO_DB_URI: mongodb://mongodb:27017/todo_devsecops
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
