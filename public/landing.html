<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to TasksPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style/index.css" />
</head>
<body class="landing-body">
  <div class="glass-bg"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <header class="topbar glass topbar-landing">
    <div class="container topbar__inner">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">🚀</div>
        <div class="brand__title">TasksPro</div>
      </div>
      <div class="topbar__actions">
        <a href="/signin" class="btn btn--ghost">Sign In</a>
        <a href="/signup" class="btn btn--primary">Sign Up</a>
      </div>
    </div>
  </header>

  <main class="landing-hero">
    <div class="hero-content fade-in-up">
      <h1 class="hero-title">Manage Your Tasks with <span class="highlight">Elegance</span></h1>
      <p class="hero-subtitle">Experience a premium, fast, and secure way to track what matters most to your productivity.</p>
      <div class="hero-cta">
        <a href="/notes" class="btn btn--glow">Go to My Notes</a>
      </div>
    </div>
    <div class="hero-visual fade-in-up delay-1">
      <div class="floating-card c1">✓ Plan your day</div>
      <div class="floating-card c2">🔒 Bank-grade security</div>
      <div class="floating-card c3">✨ Beautiful UI</div>
    </div>
  </main>
</body>
</html>
