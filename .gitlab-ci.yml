stages:
  - validate
  - test
  - security
  - infrastructure
  - package
  - zap
  - deploy
  - notify

default:
  tags:
    - todo-app-runner

variables:
  APP_NAME: "todo-app"
  AWS_ECR_REPOSITORY: "todo-app"
  AWS_REGION: "eu-west-3"
  DEPLOY_ENV: "staging"
  DAST_TARGET_URL: "http://127.0.0.1:5000"
  GIT_DEPTH: "5"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_CACHE: 'D:\Gitlab-Runner\npm-cache'
  SAST_SCANNERS: "semgrep"
  TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2"
  K8S_SERVICE_TYPE: "LoadBalancer"
  K8S_STAGING_NAMESPACE: "todo-staging"
  K8S_PRODUCTION_NAMESPACE: "todo-production"
  ZAP_TIMEOUT_SECONDS: "180"

workflow:
  auto_cancel:
    on_new_commit: interruptible

.windows_job:
  interruptible: true
  before_script:
    - $ErrorActionPreference = "Stop"
    - node --version
    - npm --version
    - |
      if ($env:NPM_CONFIG_CACHE) {
        New-Item -ItemType Directory -Force -Path "$env:NPM_CONFIG_CACHE" | Out-Null
      }

validate_app:
  stage: validate
  timeout: 5 minutes
  extends: .windows_job
  script:
    - node --check server.js

unit_tests:
  stage: test
  timeout: 10 minutes
  extends: .windows_job
  script:
    - npm i
    - npm test

dependency_scan:
  stage: security
  timeout: 8 minutes
  extends: .windows_job
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode dependencies
  artifacts:
    when: always
    paths:
      - reports/npm-audit/
    expire_in: 7 days

secret_scan:
  stage: security
  timeout: 5 minutes
  resource_group: local-docker-scanners
  extends: .windows_job
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode secrets
  artifacts:
    when: always
    paths:
      - reports/gitleaks/
    expire_in: 7 days

sast_scan:
  stage: security
  timeout: 10 minutes
  resource_group: local-docker-scanners
  extends: .windows_job
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode sast -SastScanners "semgrep"
  artifacts:
    when: always
    paths:
      - reports/semgrep/
      - reports/sonarqube/
    expire_in: 7 days

semgrep_scan:
  stage: security
  timeout: 8 minutes
  resource_group: local-docker-scanners
  extends: .windows_job
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode semgrep
  artifacts:
    when: always
    paths:
      - reports/semgrep/
    expire_in: 7 days

docker_image_scan:
  stage: security
  timeout: 15 minutes
  resource_group: local-docker-scanners
  extends: .windows_job
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode docker -ImageName "todo-app:$env:CI_COMMIT_SHORT_SHA"
  artifacts:
    when: always
    paths:
      - reports/trivy/
    expire_in: 7 days

terraform_aws_staging:
  stage: infrastructure
  timeout: 45 minutes
  resource_group: aws-k8s-deploy
  extends: .windows_job
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\terraform-aws-staging.ps1 -AwsRegion "$env:AWS_REGION" -ClusterName "$env:AWS_EKS_CLUSTER_NAME" -AutoApprove
  artifacts:
    when: always
    reports:
      dotenv: reports/aws/infra.env
    paths:
      - reports/aws/infra.env
    expire_in: 7 days
  rules:
    - if: '$RUN_AWS_STAGING == "true" || $CI_COMMIT_BRANCH == "AI-Agent"'
      when: on_success
      allow_failure: false
    - when: never

package_image:
  stage: package
  timeout: 10 minutes
  resource_group: local-docker-scanners
  extends: .windows_job
  script:
    - |
      $image = "todo-app:$env:CI_COMMIT_SHORT_SHA"
      docker build -t $image .
      if ($env:CI_REGISTRY -and $env:CI_REGISTRY_IMAGE -and $env:CI_REGISTRY_USER -and $env:CI_REGISTRY_PASSWORD) {
        docker login -u "$env:CI_REGISTRY_USER" -p "$env:CI_REGISTRY_PASSWORD" "$env:CI_REGISTRY"
        docker tag $image "$env:CI_REGISTRY_IMAGE:$env:CI_COMMIT_SHORT_SHA"
        docker tag $image "$env:CI_REGISTRY_IMAGE:latest"
        docker push "$env:CI_REGISTRY_IMAGE:$env:CI_COMMIT_SHORT_SHA"
        docker push "$env:CI_REGISTRY_IMAGE:latest"
      } else {
        throw "GitLab registry variables are missing. Enable the GitLab Container Registry or configure registry CI/CD variables."
      }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

aws_ecr_package:
  stage: package
  timeout: 15 minutes
  resource_group: aws-k8s-deploy
  extends: .windows_job
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\aws-ecr-push.ps1 -AwsRegion "$env:AWS_REGION" -RepositoryName "$env:AWS_ECR_REPOSITORY" -ImageTag "$env:CI_COMMIT_SHORT_SHA"
  artifacts:
    reports:
      dotenv: reports/aws/deploy.env
    paths:
      - reports/aws/deploy.env
    expire_in: 7 days
  rules:
    - if: '$RUN_AWS_STAGING == "true" || $RUN_AWS_PRODUCTION == "true" || $CI_COMMIT_BRANCH == "AI-Agent"'
      when: on_success
      allow_failure: false
    - when: never

zap_scan:
  stage: zap
  timeout: 8 minutes
  resource_group: local-docker-scanners
  extends: .windows_job
  script:
    - |
      if (-not (Test-Path ".env")) {
        powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -ForceEnv -SkipNpmInstall
      }
      docker compose down --remove-orphans
      @("todo-app", "todo-mongodb") | ForEach-Object {
        $containerId = docker ps -aq --filter "name=^/$($_)$"
        if ($containerId) { docker rm -f $containerId | Out-Null }
      }
      docker compose up -d --build
      powershell -ExecutionPolicy Bypass -File scripts\wait-http.ps1 -Url "$env:DAST_TARGET_URL/health" -TimeoutSeconds 120
      powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode zap -TargetUrl "$env:DAST_TARGET_URL" -ZapTimeoutSeconds "$env:ZAP_TIMEOUT_SECONDS"
  after_script:
    - docker compose down --remove-orphans
  artifacts:
    when: always
    paths:
      - reports/zap/
    expire_in: 7 days
  when: always

deploy_aws_staging:
  stage: deploy
  timeout: 10 minutes
  resource_group: aws-k8s-deploy
  extends: .windows_job
  dependencies:
    - aws_ecr_package
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\deploy-aws-k8s.ps1 -Environment staging -AwsRegion "$env:AWS_REGION" -ClusterName "$env:AWS_EKS_CLUSTER_NAME" -Namespace "$env:K8S_STAGING_NAMESPACE" -Image "$env:K8S_IMAGE" -ServiceType "LoadBalancer" -RequireSecrets
  environment:
    name: aws-staging
    url: $APP_URL
  artifacts:
    reports:
      dotenv: reports/aws/deployment.env
    paths:
      - reports/aws/deployment.env
    expire_in: 7 days
  rules:
    - if: '$RUN_AWS_STAGING == "true" || $CI_COMMIT_BRANCH == "AI-Agent"'
      when: on_success
      allow_failure: false
    - when: never

deploy_aws_production:
  stage: deploy
  timeout: 10 minutes
  resource_group: aws-k8s-deploy
  extends: .windows_job
  dependencies:
    - aws_ecr_package
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\deploy-aws-k8s.ps1 -Environment production -AwsRegion "$env:AWS_REGION" -ClusterName "$env:AWS_EKS_CLUSTER_NAME" -Namespace "$env:K8S_PRODUCTION_NAMESPACE" -Image "$env:K8S_IMAGE" -ServiceType "$env:K8S_SERVICE_TYPE" -RequireSecrets
  environment:
    name: aws-production
    url: $APP_URL
  artifacts:
    reports:
      dotenv: reports/aws/deployment.env
    paths:
      - reports/aws/deployment.env
    expire_in: 7 days
  rules:
    - if: '$RUN_AWS_PRODUCTION == "true"'
      when: on_success
      allow_failure: false
    - when: never

notify_pipeline:
  stage: notify
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\pipeline-notify.ps1
  when: always
