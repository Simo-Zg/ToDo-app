stages:
  - validate
  - test
  - security
  - package
  - zap
  - deploy
  - notify

default:
  tags:
    - todo-app-runner

variables:
  APP_NAME: "todo-app"
  DEPLOY_ENV: "staging"
  DAST_TARGET_URL: "http://127.0.0.1:5000"
  GIT_DEPTH: "5"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_CACHE: 'D:\Gitlab-Runner\npm-cache'
  SAST_SCANNERS: "sonarqube"
  TRIVY_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-db:2"
  ZAP_TIMEOUT_SECONDS: "180"

workflow:
  auto_cancel:
    on_new_commit: interruptible

.windows_job:
  interruptible: true
  before_script:
    - $ErrorActionPreference = "Stop"
    - node --version
    - npm --version
    - |
      if ($env:NPM_CONFIG_CACHE) {
        New-Item -ItemType Directory -Force -Path "$env:NPM_CONFIG_CACHE" | Out-Null
      }

.security_after_script:
  after_script:
    - |
      if ($env:CI_JOB_STATUS -ne "success") {
        powershell -ExecutionPolicy Bypass -File scripts\notify-telegram.ps1 -Message 'Security job failed in pipeline $env:CI_PIPELINE_ID: $env:CI_JOB_NAME. $env:CI_PIPELINE_URL'
      }

validate_app:
  stage: validate
  timeout: 5 minutes
  extends: .windows_job
  script:
    - node --check server.js

unit_tests:
  stage: test
  timeout: 10 minutes
  extends: .windows_job
  script:
    - npm i
    - npm test

dependency_scan:
  stage: security
  timeout: 8 minutes
  extends:
    - .windows_job
    - .security_after_script
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode dependencies
  artifacts:
    when: always
    paths:
      - reports/npm-audit/
    expire_in: 7 days

secret_scan:
  stage: security
  timeout: 5 minutes
  resource_group: local-docker-scanners
  extends:
    - .windows_job
    - .security_after_script
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode secrets
  artifacts:
    when: always
    paths:
      - reports/gitleaks/
    expire_in: 7 days

sast_scan:
  stage: security
  timeout: 10 minutes
  resource_group: local-docker-scanners
  extends:
    - .windows_job
    - .security_after_script
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode sast -SastScanners "$env:SAST_SCANNERS"
  artifacts:
    when: always
    paths:
      - reports/semgrep/
      - reports/sonarqube/
    expire_in: 7 days

semgrep_scan:
  stage: security
  timeout: 8 minutes
  resource_group: local-docker-scanners
  extends:
    - .windows_job
    - .security_after_script
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode semgrep
  artifacts:
    when: always
    paths:
      - reports/semgrep/
    expire_in: 7 days

docker_image_scan:
  stage: security
  timeout: 15 minutes
  resource_group: local-docker-scanners
  extends:
    - .windows_job
    - .security_after_script
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode docker -ImageName "todo-app:$env:CI_COMMIT_SHORT_SHA"
  artifacts:
    when: always
    paths:
      - reports/trivy/
    expire_in: 7 days

package_image:
  stage: package
  timeout: 10 minutes
  resource_group: local-docker-scanners
  extends: .windows_job
  script:
    - |
      $image = "todo-app:$env:CI_COMMIT_SHORT_SHA"
      docker build -t $image .
      if ($env:CI_REGISTRY -and $env:CI_REGISTRY_IMAGE -and $env:CI_REGISTRY_USER -and $env:CI_REGISTRY_PASSWORD) {
        docker login -u "$env:CI_REGISTRY_USER" -p "$env:CI_REGISTRY_PASSWORD" "$env:CI_REGISTRY"
        docker tag $image "$env:CI_REGISTRY_IMAGE:$env:CI_COMMIT_SHORT_SHA"
        docker tag $image "$env:CI_REGISTRY_IMAGE:latest"
        docker push "$env:CI_REGISTRY_IMAGE:$env:CI_COMMIT_SHORT_SHA"
        docker push "$env:CI_REGISTRY_IMAGE:latest"
      } else {
        Write-Host "GitLab registry variables are not available. Local image built only: $image"
      }
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$RUN_DEPLOY == "true"'

zap_scan:
  stage: zap
  timeout: 8 minutes
  resource_group: local-docker-scanners
  extends:
    - .windows_job
    - .security_after_script
  script:
    - |
      if (-not (Test-Path ".env")) {
        powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -ForceEnv -SkipNpmInstall
      }
      docker compose down --remove-orphans
      @("todo-app", "todo-mongodb") | ForEach-Object {
        $containerId = docker ps -aq --filter "name=^/$($_)$"
        if ($containerId) { docker rm -f $containerId | Out-Null }
      }
      docker compose up -d --build
      powershell -ExecutionPolicy Bypass -File scripts\wait-http.ps1 -Url "$env:DAST_TARGET_URL/health" -TimeoutSeconds 120
      powershell -ExecutionPolicy Bypass -File scripts\security-scan.ps1 -Mode zap -TargetUrl "$env:DAST_TARGET_URL" -ZapTimeoutSeconds "$env:ZAP_TIMEOUT_SECONDS"
  after_script:
    - docker compose down --remove-orphans
    - |
      if ($env:CI_JOB_STATUS -ne "success") {
        powershell -ExecutionPolicy Bypass -File scripts\notify-telegram.ps1 -Message 'ZAP DAST failed in pipeline $env:CI_PIPELINE_ID. $env:CI_PIPELINE_URL'
      }
  artifacts:
    when: always
    paths:
      - reports/zap/
    expire_in: 7 days
  when: always

deploy_local:
  stage: deploy
  extends: .windows_job
  script:
    - |
      if (-not (Test-Path ".env")) {
        powershell -ExecutionPolicy Bypass -File scripts\install.ps1 -ForceEnv -SkipNpmInstall
      }
      powershell -ExecutionPolicy Bypass -File scripts\deploy-local.ps1 -Environment "$env:DEPLOY_ENV"
  environment:
    name: $DEPLOY_ENV
    url: http://127.0.0.1:5000
  rules:
    - if: '$RUN_DEPLOY == "true"'

notify_pipeline:
  stage: notify
  script:
    - powershell -ExecutionPolicy Bypass -File scripts\pipeline-notify.ps1
  when: always
